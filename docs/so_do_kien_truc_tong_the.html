<desc id="financial-architecture-desc">Các ứng dụng Python trên máy chạy demo gọi Kafka và MinIO trong Docker Compose. Producer gửi JSON tới Kafka. Bộ xử lý microbatch đọc và commit offset, gửi một số lỗi tới topic DLQ, ghi Parquet và thông tin batch lên MinIO. DuckDB đọc MinIO qua S3; công cụ compaction đọc ghi MinIO khi áp dụng. Kafka UI kết nối Kafka qua mạng Docker. Mũi tên biểu thị bên gọi tới dịch vụ được gọi, không biểu thị chiều di chuyển của từng bản ghi.</desc>
