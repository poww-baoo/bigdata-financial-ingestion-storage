services:
  # ==========================================================================
  # 1. APACHE KAFKA (KRaft Mode - Không cần ZooKeeper) - Phụ trách: Thành viên 1
  # ==========================================================================
  kafka:
    image: apache/kafka:3.7.0
    container_name: fin-kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_LISTENERS=PLAINTEXT://:29092,CONTROLLER://:9093,EXTERNAL://:9092
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_NUM_PARTITIONS=3
      - KAFKA_LOG_RETENTION_HOURS=24
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Khởi tạo sẵn Kafka Topics với đúng số Partition chuẩn Big Data
  kafka-init:
    image: apache/kafka:3.7.0
    container_name: fin-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [ "/bin/sh", "-c" ]
    command: |
      "
      echo 'Đang khởi tạo các Kafka Topics cho luồng Giao dịch Tài chính...'
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic financial_tx --partitions 3 --replication-factor 1
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic financial_tx_dlq --partitions 1 --replication-factor 1
      echo 'Danh sách Topics hiện tại:'
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --describe
      "

  # Giao diện Web quản lý Kafka (Chụp ảnh minh chứng cho Báo cáo)
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: fin-kafka-ui
    ports:
      - "8080:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=financial-cluster
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  # ==========================================================================
  # 2. MINIO OBJECT STORAGE (S3 Data Lake) - Phụ trách: Thành viên 3
  # ==========================================================================
  minio:
    image: elestio/minio:latest
    container_name: fin-minio
    ports:
      - "9000:9000"   # S3 API Port
      - "9001:9001"   # MinIO Web Console Port
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-minioadmin123}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Tự động tạo Bucket Data Lake khi khởi động
  minio-init:
    image: elestio/minio:latest
    container_name: fin-minio-init
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin123}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-financial-datalake}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -ec "
      mc alias set local http://minio:9000 $${MINIO_ACCESS_KEY:-minioadmin} $${MINIO_SECRET_KEY:-minioadmin123};
      mc mb --ignore-existing local/$${MINIO_BUCKET_NAME:-financial-datalake};
      mc anonymous set none local/$${MINIO_BUCKET_NAME:-financial-datalake};
      echo 'Bucket financial-datalake đã sẵn sàng!';
      "

volumes:
  kafka_data:
  minio_data:
